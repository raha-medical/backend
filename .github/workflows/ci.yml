name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "console;verbosity=normal"
      - run: docker build -t alrahma-api:ci .
      - name: Container startup and database health
        run: |
          docker run -d --name api-smoke --network host \
            -e PORT=8099 \
            -e 'ConnectionStrings__Default=Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres' \
            -e Jwt__SigningKey=ci-only-fake-signing-key-not-for-deployment-0123456789 \
            alrahma-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8099/health; then exit 0; fi
            sleep 2
          done
          docker logs api-smoke
          exit 1
      - name: Remove smoke container
        if: always()
        run: docker rm -f api-smoke || true
