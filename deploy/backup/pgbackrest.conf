# =============================================================================
# pgBackRest لمجمع الرحمة (مجاني بالكامل)
#   repo1: قرص السيرفر المحلي (مجلد /var/lib/pgbackrest داخل الحاوية، على volume منفصل)
#   repo2: اختياري (قرص ثانٍ، أو سيرفر فرع آخر، أو S3 متوافق). انسخ repo2.conf.example
#          إلى conf.d/repo2.conf وفعّل BACKUP_REPO2=1. التخزين السحابي باشتراك يُفعّل فقط بطلب مدير المجمع.
#   كلمة سر التشفير من متغير البيئة PGBACKREST_REPO1_CIPHER_PASS (ولا تُكتب هنا أبداً).
#   الاحتفاظ (4 أسبوعية + 12 شهرية) ينفذه retention.sh، لذلك retention-full كبير هنا.
#   WAL: يُحفظ لآخر نسختين كاملتين (أسبوعيتين) = 14 يوماً للاسترجاع لأي نقطة زمنية.
# =============================================================================
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=count
repo1-retention-full=9999
repo1-retention-archive-type=full
repo1-retention-archive=2
repo1-bundle=y
repo1-block=y

compress-type=zst
compress-level=3
process-max=2
start-fast=y
archive-check=y
delta=y

log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[alrahma]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
